name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: streamwise-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend dataset scripts tests api
      - name: Generate dataset and train model (data/ and artifacts/ are gitignored)
        run: |
          python dataset/generate.py --output data/raw
          python -m backend.ml.train
      - run: pytest -q
      - name: Verify reproducible model training
        run: python -m backend.ml.train --artifact-dir "$RUNNER_TEMP/streamwise-artifacts"

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  docker:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build application image
        run: docker build --tag streamwise:ci .
      - name: Smoke test application container
        run: |
          docker run --detach --name streamwise-ci --publish 8000:8000 streamwise:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/readyz; then
              exit 0
            fi
            sleep 2
          done
          docker logs streamwise-ci
          exit 1
