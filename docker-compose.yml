services:
  streamwise:
    build:
      context: .
      dockerfile: Dockerfile
    image: streamwise:local
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /app/data/raw
      ARTIFACT_DIR: /app/artifacts
      CORS_ORIGINS: http://localhost:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
