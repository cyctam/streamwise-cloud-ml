<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{% endblock %}Streamwise</title>
<meta name="description" content="Stream prediction and demand forecasting served from AWS Lambda.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-page="{{ page }}">
<header class="top"><div class="wrap">
  <a class="mark" href="/">Streamwise</a>
  <nav aria-label="Main">
    <a href="/prediction" {% if page == 'prediction' %}aria-current="page"{% endif %}>Prediction</a>
    <a href="/forecasting" {% if page == 'forecasting' %}aria-current="page"{% endif %}>Forecasting</a>
  </nav>
  <span class="mode" data-mode="{{ mode }}" title="Backend mode">{{ mode|upper }}</span>
</div></header>
<main><div class="wrap">{% block main %}{% endblock %}</div></main>
<footer><div class="wrap">Streamwise &middot; ML on AWS Lambda, DynamoDB and S3{% if mode == 'demo' %} &middot; demo data is synthetic{% endif %}</div></footer>
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
